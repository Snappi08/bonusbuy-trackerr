<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 BonusBuy | Snappi08</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #1a0033 0%, #2d0052 50%, #0d001a 100%);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
    background-attachment: fixed;
  }
  
  .container { max-width: 1200px; margin: 0 auto; }

  /* ===== Брендинг ===== */
  .brand-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 15px;
  }
  
  .brand-kick {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(83, 252, 24, 0.1);
    border: 1px solid rgba(83, 252, 24, 0.4);
    border-radius: 12px;
    padding: 8px 14px;
    text-decoration: none;
    color: #fff;
    transition: all 0.2s;
  }
  
  .brand-kick:hover {
    background: rgba(83, 252, 24, 0.2);
    box-shadow: 0 0 20px rgba(83, 252, 24, 0.5);
    transform: translateY(-2px);
  }
  
  .kick-logo {
    background: #53fc18;
    color: #000;
    font-weight: 900;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.95em;
    letter-spacing: 1px;
  }
  
  .kick-text { font-weight: 700; font-size: 0.95em; }
  .kick-text small { display: block; font-size: 0.75em; color: #a0aec0; font-weight: 400; }
  
  .brand-streamer {
    font-size: 1.05em;
    font-weight: 800;
    color: #ffcc00;
    text-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
  }
  
  .brand-streamer span { color: #b794f6; font-weight: 400; font-size: 0.85em; }

  h1 {
    text-align: center;
    font-size: 2.5em;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #ff00cc, #ffcc00, #00ffcc, #ff00cc);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 4s linear infinite;
    font-weight: 900;
    letter-spacing: 2px;
    position: relative;
  }

  /* Надпись MONEY-X в углу */
  .money-x {
    position: fixed;
    right: 20px;
    bottom: 20px;
    font-size: 1.6em;
    font-weight: 900;
    letter-spacing: 3px;
    color: #ff00cc;
    text-shadow: 0 0 10px #ff00cc, 0 0 20px #ff00cc, 0 0 30px #7700ff;
    z-index: 999;
    pointer-events: none;
    opacity: 0.85;
    font-style: italic;
  }
  
  @keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  
  .subtitle {
    text-align: center;
    color: #b794f6;
    margin-bottom: 20px;
    font-size: 1.05em;
  }
  
  /* Статистика */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
  }
  
  .stat-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  
  .stat-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(255, 0, 204, 0.3);
  }
  
  .stat-label { font-size: 0.78em; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .stat-value { font-size: 1.6em; font-weight: 900; }
  
  .profit-pos { color: #00ff88; text-shadow: 0 0 15px rgba(0, 255, 136, 0.5); }
  .profit-neg { color: #ff3366; text-shadow: 0 0 15px rgba(255, 51, 102, 0.5); }
  .profit-neutral { color: #ffcc00; }
  
  /* Форма */
  .form-box {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  
  .form-title {
    font-size: 1.2em;
    margin-bottom: 15px;
    color: #ffcc00;
    font-weight: 700;
  }
  
  .form-row {
    display: grid;
    grid-template-columns: 2fr 1fr auto;
    gap: 12px;
    align-items: end;
  }
  
  .input-group { display: flex; flex-direction: column; }
  .input-group label { font-size: 0.8em; color: #a0aec0; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
  
  input {
    background: rgba(0, 0, 0, 0.4);
    border: 2px solid rgba(255, 0, 204, 0.3);
    border-radius: 10px;
    padding: 12px 14px;
    color: #fff;
    font-size: 1em;
    transition: all 0.2s;
    outline: none;
    font-weight: 600;
  }
  
  input:focus {
    border-color: #ff00cc;
    box-shadow: 0 0 15px rgba(255, 0, 204, 0.5);
  }
  
  input::placeholder { color: #4a5568; font-weight: 400; }
  
  button {
    background: linear-gradient(135deg, #ff00cc, #7700ff);
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    color: #fff;
    font-size: 1em;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(255, 0, 204, 0.7);
  }
  
  button:active { transform: scale(0.98); }
  
  .btn-clear {
    background: linear-gradient(135deg, #ff3366, #ff6633);
    padding: 12px 20px;
    font-size: 0.9em;
  }
  
  /* Список бонусов */
  .bonuses-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 60px;
  }
  
  .bonus-item {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 15px 20px;
    transition: all 0.2s;
    animation: slideIn 0.3s ease;
  }
  
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .bonus-item:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 0, 204, 0.4);
  }
  
  .bonus-item.profit-pos-item { border-left: 4px solid #00ff88; }
  .bonus-item.profit-neg-item { border-left: 4px solid #ff3366; }
  .bonus-item.profit-neutral-item { border-left: 4px solid #ffcc00; }
  .bonus-item.pending-item { border-left: 4px solid #7700ff; }
  
  .bonus-main {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
    gap: 15px;
    align-items: center;
  }
  
  .bonus-slot {
    font-weight: 700;
    font-size: 1.05em;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  .bonus-cell {
    text-align: center;
    font-size: 0.95em;
  }
  
  .bonus-cell .label { font-size: 0.7em; color: #718096; display: block; margin-bottom: 2px; text-transform: uppercase; }
  .bonus-cell .value { font-weight: 700; }
  
  .x-value { font-size: 1.3em !important; }
  
  .status-pending {
    color: #a78bfa;
    font-size: 0.9em;
    font-weight: 700;
    text-align: center;
  }
  
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  
  .btn-open {
    background: linear-gradient(135deg, #00d4ff, #7700ff);
    padding: 8px 14px;
    font-size: 0.82em;
    border-radius: 8px;
  }
  
  .btn-open:hover { box-shadow: 0 0 20px rgba(0, 212, 255, 0.7); }

  .btn-edit {
    background: linear-gradient(135deg, #ffcc00, #ff8800);
    color: #331a00;
    padding: 8px 14px;
    font-size: 0.82em;
    border-radius: 8px;
  }
  
  .btn-edit:hover { box-shadow: 0 0 20px rgba(255, 204, 0, 0.7); }
  
  .delete-btn {
    background: rgba(255, 51, 102, 0.2);
    border: 1px solid rgba(255, 51, 102, 0.5);
    padding: 8px 12px;
    font-size: 1em;
    border-radius: 8px;
  }
  
  .delete-btn:hover {
    background: rgba(255, 51, 102, 0.5);
    box-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
  }
  
  /* Панели (открытие / редактирование) */
  .open-panel {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px dashed rgba(255, 255, 255, 0.2);
    display: none;
    animation: slideIn 0.2s ease;
  }
  
  .open-panel.active { display: block; }
  
  .open-panel-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto auto;
    gap: 12px;
    align-items: end;
  }
  
  .btn-confirm {
    background: linear-gradient(135deg, #00ff88, #00cc66);
    color: #003322;
  }
  
  .btn-confirm:hover { box-shadow: 0 0 25px rgba(0, 255, 136, 0.7); }
  
  .btn-cancel {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .btn-save-edit {
    background: linear-gradient(135deg, #ffcc00, #ff8800);
    color: #331a00;
  }
  
  .btn-save-edit:hover { box-shadow: 0 0 25px rgba(255, 204, 0, 0.7); }
  
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: #718096;
    font-size: 1.1em;
  }
  
  .empty-state .emoji { font-size: 3em; display: block; margin-bottom: 15px; }
  
  /* Адаптив */
  @media (max-width: 768px) {
    h1 { font-size: 1.8em; }
    .form-row { grid-template-columns: 1fr; }
    .bonus-main { grid-template-columns: 1fr 1fr; gap: 10px; }
    .bonus-slot { grid-column: span 2; }
    .actions { grid-column: span 2; justify-content: flex-end; }
    .open-panel-row { grid-template-columns: 1fr; }
    .money-x { font-size: 1em; right: 10px; bottom: 10px; }
    .brand-bar { justify-content: center; text-align: center; }
  }
  
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
  }
</style>
</head>
<body>

<!-- Надпись MONEY-X в углу -->
<div class="money-x">MONEY-X</div>

<div class="container">

  <!-- Брендинг: Kick + стример -->
  <div class="brand-bar">
    <a class="brand-kick" href="https://kick.com/snappi08" target="_blank" rel="noopener">
      <span class="kick-logo">KICK</span>
      <span class="kick-text">
        Мой канал на Kick
        <small>kick.com/snappi08 — заходи на стрим!</small>
      </span>
    </a>
    <div class="brand-streamer">Snappi08 <span>• MONEY-X</span></div>
  </div>

  <h1>🎰 BonusBuy</h1>
  <p class="subtitle">Сначала добавляй бонусы, потом открывай и записывай иксы 💸</p>

  <!-- Статистика -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Всего бонусов</div>
      <div class="stat-value" id="stat-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ожидают открытия</div>
      <div class="stat-value" id="stat-pending" style="color:#a78bfa">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Потрачено</div>
      <div class="stat-value" id="stat-spent">0 ₽</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Выиграно</div>
      <div class="stat-value" id="stat-won">0 ₽</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Общий профит</div>
      <div class="stat-value profit-neutral" id="stat-profit">0 ₽</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Средний икс</div>
      <div class="stat-value profit-neutral" id="stat-avg-x">0x</div>
    </div>
  </div>

  <!-- Форма добавления бонуса -->
  <div class="form-box">
    <div class="form-title">➕ Добавить бонус (закупка)</div>
    <div class="form-row">
      <div class="input-group">
        <label>Слот</label>
        <input type="text" id="inp-slot" placeholder="Введи название слота">
      </div>
      <div class="input-group">
        <label>Стоимость (₽)</label>
        <input type="number" id="inp-cost" placeholder="Введи цену" min="0" step="1">
      </div>
      <button onclick="addBonus()">ДОБАВИТЬ</button>
    </div>
  </div>

  <!-- Список бонусов -->
  <div class="header-row">
    <div class="form-title" style="margin:0">📋 Список бонусов</div>
    <button class="btn-clear" onclick="clearAll()">🗑 Очистить всё</button>
  </div>
  <div class="bonuses-list" id="bonuses-list"></div>
</div>

<script>
  let bonuses = JSON.parse(localStorage.getItem('bonusbuy_data')) || [];
  let openPanelId = null;
  let editPanelId = null;

  function save() {
    localStorage.setItem('bonusbuy_data', JSON.stringify(bonuses));
  }

  function formatMoney(n) {
    return Math.round(n).toLocaleString('ru-RU') + ' ₽';
  }

  function formatX(n) {
    if (n === Infinity) return '∞';
    return n.toFixed(2) + 'x';
  }

  function addBonus() {
    const slot = document.getElementById('inp-slot').value.trim();
    const cost = parseFloat(document.getElementById('inp-cost').value);

    if (!slot) { alert('Введи название слота!'); return; }
    if (isNaN(cost) || cost <= 0) { alert('Введи корректную стоимость бонуса!'); return; }

    bonuses.unshift({
      id: Date.now(),
      slot,
      cost,
      win: null,
      opened: false
    });

    save();
    render();

    document.getElementById('inp-slot').value = '';
    document.getElementById('inp-cost').value = '';
    document.getElementById('inp-slot').focus();
  }

  function toggleOpenPanel(id) {
    openPanelId = (openPanelId === id) ? null : id;
    if (openPanelId) editPanelId = null;
    render();
    if (openPanelId) {
      setTimeout(() => {
        const inp = document.getElementById('win-input-' + id);
        if (inp) inp.focus();
      }, 50);
    }
  }

  function confirmWin(id) {
    const inp = document.getElementById('win-input-' + id);
    const win = parseFloat(inp.value);
    if (isNaN(win) || win < 0) { alert('Введи корректный выигрыш!'); return; }

    const b = bonuses.find(x => x.id === id);
    if (!b) return;

    b.win = win;
    b.opened = true;
    openPanelId = null;
    save();
    render();
  }

  function toggleEditPanel(id) {
    editPanelId = (editPanelId === id) ? null : id;
    if (editPanelId) openPanelId = null;
    render();
    if (editPanelId) {
      setTimeout(() => {
        const inp = document.getElementById('edit-slot-' + id);
        if (inp) { inp.focus(); inp.select(); }
      }, 50);
    }
  }

  function saveEdit(id) {
    const slotInp = document.getElementById('edit-slot-' + id);
    const costInp = document.getElementById('edit-cost-' + id);
    const newSlot = slotInp.value.trim();
    const newCost = parseFloat(costInp.value);

    if (!newSlot) { alert('Название слота не может быть пустым!'); return; }
    if (isNaN(newCost) || newCost <= 0) { alert('Введи корректную стоимость!'); return; }

    const b = bonuses.find(x => x.id === id);
    if (!b) return;

    b.slot = newSlot;
    b.cost = newCost;
    editPanelId = null;
    save();
    render();
  }

  function deleteBonus(id) {
    if (!confirm('Удалить этот бонус?')) return;
    bonuses = bonuses.filter(b => b.id !== id);
    if (openPanelId === id) openPanelId = null;
    if (editPanelId === id) editPanelId = null;
    save();
    render();
  }

  function clearAll() {
    if (bonuses.length === 0) return;
    if (!confirm('Удалить ВСЮ историю бонусов? Это нельзя отменить.')) return;
    bonuses = [];
    openPanelId = null;
    editPanelId = null;
    save();
    render();
  }

  function render() {
    const list = document.getElementById('bonuses-list');

    const opened = bonuses.filter(b => b.opened);
    const pending = bonuses.length - opened.length;
    const totalSpent = opened.reduce((s, b) => s + b.cost, 0);
    const totalWon = opened.reduce((s, b) => s + b.win, 0);
    const totalProfit = totalWon - totalSpent;
    const avgX = totalSpent > 0 ? totalWon / totalSpent : 0;

    document.getElementById('stat-count').textContent = bonuses.length;
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-spent').textContent = formatMoney(totalSpent);
    document.getElementById('stat-won').textContent = formatMoney(totalWon);

    const profitEl = document.getElementById('stat-profit');
    profitEl.textContent = (totalProfit >= 0 ? '+' : '') + formatMoney(totalProfit);
    profitEl.className = 'stat-value ' + (totalProfit > 0 ? 'profit-pos' : totalProfit < 0 ? 'profit-neg' : 'profit-neutral');

    const avgEl = document.getElementById('stat-avg-x');
    avgEl.textContent = formatX(avgX);
    avgEl.className = 'stat-value ' + (avgX > 1 ? 'profit-pos' : avgX < 1 ? 'profit-neg' : 'profit-neutral');

    if (bonuses.length === 0) {
      list.innerHTML = `<div class="empty-state"><span class="emoji">🎲</span>Пока пусто. Добавь свой первый бонус!</div>`;
      return;
    }

    list.innerHTML = bonuses.map(b => {
      const isOpen = openPanelId === b.id;
      const isEdit = editPanelId === b.id;

      let cls, xHtml, profitHtml;

      if (!b.opened) {
        cls = 'pending-item';
        xHtml = `<span class="status-pending">—</span>`;
        profitHtml = `<span class="status-pending">не открыт</span>`;
      } else {
        const x = b.win / b.cost;
        const profit = b.win - b.cost;
        const xCls = x > 1 ? 'profit-pos' : x < 1 ? 'profit-neg' : 'profit-neutral';
        cls = x > 1 ? 'profit-pos-item' : x < 1 ? 'profit-neg-item' : 'profit-neutral-item';
        xHtml = `<span class="value x-value ${xCls}">${formatX(x)}</span>`;
        profitHtml = `<span class="value ${xCls}">${(profit >= 0 ? '+' : '') + formatMoney(profit)}</span>`;
      }

      const openPanel = isOpen ? `
        <div class="open-panel active">
          <div class="open-panel-row">
            <div class="input-group">
              <label>Выигрыш с бонуса (₽)</label>
              <input type="number" id="win-input-${b.id}" placeholder="Введи выигрыш" min="0" step="1"
                     onkeydown="if(event.key==='Enter')confirmWin(${b.id})">
            </div>
            <button class="btn-confirm" onclick="confirmWin(${b.id})">✓ ПОДТВЕРДИТЬ</button>
            <button class="btn-cancel" onclick="toggleOpenPanel(${b.id})">✕ ОТМЕНА</button>
          </div>
        </div>
      ` : '';

      const editPanel = isEdit ? `
        <div class="open-panel active">
          <div class="open-panel-row">
            <div class="input-group">
              <label>Название слота</label>
              <input type="text" id="edit-slot-${b.id}" value="${escapeAttr(b.slot)}" placeholder="Название слота">
            </div>
            <div class="input-group">
              <label>Стоимость (₽)</label>
              <input type="number" id="edit-cost-${b.id}" value="${b.cost}" min="0" step="1">
            </div>
            <button class="btn-save-edit" onclick="saveEdit(${b.id})">💾 СОХРАНИТЬ</button>
            <button class="btn-cancel" onclick="toggleEditPanel(${b.id})">✕ ОТМЕНА</button>
          </div>
        </div>
      ` : '';

      const openBtn = !b.opened
        ? `<button class="btn-open" onclick="toggleOpenPanel(${b.id})">${isOpen ? '▲ Скрыть' : '▶ Открыть'}</button>`
        : `<button class="btn-open" onclick="toggleOpenPanel(${b.id})">${isOpen ? '▲ Скрыть' : '✎ Икс'}</button>`;

      return `
        <div class="bonus-item ${cls}">
          <div class="bonus-main">
            <div class="bonus-slot" title="${escapeAttr(b.slot)}">${escapeHtml(b.slot)}</div>
            <div class="bonus-cell"><span class="label">Куп</span><span class="value">${formatMoney(b.cost)}</span></div>
            <div class="bonus-cell"><span class="label">Выигрыш</span>${b.opened ? `<span class="value">${formatMoney(b.win)}</span>` : `<span class="value" style="color:#718096">—</span>`}</div>
            <div class="bonus-cell"><span class="label">Икс</span>${xHtml}</div>
            <div class="bonus-cell"><span class="label">Профит</span>${profitHtml}</div>
            <div class="actions">
              ${openBtn}
              <button class="btn-edit" onclick="toggleEditPanel(${b.id})">${isEdit ? '▲ Скрыть' : '✎ Изменить'}</button>
              <button class="delete-btn" onclick="deleteBonus(${b.id})">✕</button>
            </div>
          </div>
          ${openPanel}
          ${editPanel}
        </div>
      `;
    }).join('');
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) {
    return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  document.getElementById('inp-slot').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('inp-cost').focus(); });
  document.getElementById('inp-cost').addEventListener('keydown', e => { if (e.key === 'Enter') addBonus(); });

  render();
</script>
</body>
